<text x="300.00" y="482.00" text-anchor="middle" class="systems-map-segment">Memory</text>
<text x="300.00" y="506.00" text-anchor="middle" class="systems-map-segment">&amp; interconnect</text>
<path d="M 248.00 390.07 L 167.50 529.50 A 265 265 0 0 1 35.00 300.00 L 196.00 300.00 A 104 104 0 0 0 248.00 390.07 Z" fill="#f9e2d2" stroke="#dc8c54" stroke-width="1.4"/>
<text x="138.05" y="388.50" text-anchor="middle" class="systems-map-segment">Devices</text>
