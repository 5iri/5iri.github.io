- id: conway
  title: Conway in RISC-V assembly
  category: Assembly · cellular automata
  repo: https://github.com/5iri/conway-in-asm
  description: >-
    Conway's Game of Life on an 8×8 grid, written in RISC-V assembly.
    VT100 cursor control redraws the terminal as the pattern evolves.
    Assembled and run with Spike or QEMU.
  image: /assets/img/projects/conway-life.gif
  image_width: 480
  image_height: 520
  image_alt: An animated 8×8 Game of Life grid, showing thirteen generations from the RISC-V program and ending in a stable block.
  image_caption: Animation rendered from the RISC-V program's terminal output. The loop restarts after the pattern settles.
  image_source: https://github.com/5iri/conway-in-asm/blob/b0deaadbda592e4b03e198c721e0da2aa121ded2/conway.S
  # Captured from the unmodified program with qemu-riscv64; cell rendering and playback timing are for the website.
