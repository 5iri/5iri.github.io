- id: tiny3tpu
  title: Tiny3TPU
  category: FPGA accelerator · compiler · firmware
  repo: https://github.com/5iri/tiny3tpu
  description: >-
    A small FPGA compute stack on the KC705: a 100 MHz VexRiscv CPU, two
    4×4 int8 systolic cores, and a CORDIC exponential unit. A compiler lowers
    a subset of StableHLO into RISC-V code and accelerator calls. Current
    board demos include a trained digit classifier, the banana spinner 369
    mesh transform, causal attention, and cloth physics, within 64 KiB of
    on-chip RAM.
  details: https://github.com/5iri/tiny3tpu#things-that-actually-ran-on-the-board
  details_label: Board demos
  image: /markdown_files/posts/assets/tiny3tpu-stack/banana.gif
  image_width: 760
  image_height: 720
  image_alt: The banana spinner 369 demo — a rotating banana mesh drawn from coordinates the KC705 sent back.
  image_source: https://github.com/SRA-VJTI/jaxsim/blob/c0a097bba1c6db10cac7b359fbac11cfedc48c6b/examples/softras_simple_render.py (mesh source), rendered via the board's own mesh transform

- id: tt-riscv-gpu
  title: SPI matrix accelerator
  category: tt-riscv-gpu · Tiny Tapeout
  repo: https://github.com/5iri/tt-riscv-gpu
  description: >-
    A 4×4 matrix accelerator with unsigned 8-bit inputs and ternary weights.
    Two parallel lanes compute with add, subtract, and skip operations,
    producing the full result in 32 compute cycles before SPI transfer
    overhead. An SPI host loads operands, starts the engine, polls its
    status, and reads signed 20-bit results.
  details: https://github.com/5iri/tt-riscv-gpu/blob/main/docs/info.md
  details_label: Design notes
  image: /assets/img/projects/spi-matrix-gds.jpg
  image_width: 661
  image_height: 900
  image_alt: Rendered GDS layout of the tt_um_riscv_gpu die, showing standard-cell rows and vertical power straps across all metal layers.
  image_source: https://gds-viewer.tinytapeout.com (model from the tt-riscv-gpu gds GitHub Action)

- id: tt-riscv-cpu
  title: Systolic Array VGA
  category: tt-riscv-cpu · Tiny Tapeout
  repo: https://github.com/5iri/tt-riscv-cpu
  description: >-
    An 8×8 ternary matrix demo that reuses a 4×8 systolic slice across two
    passes to fit 32 processing elements. The 64 computed outputs become
    a full-screen VGA heatmap: green for positive values, red for negative,
    and blue for zero. Input pins select hardcoded matrix demos, with
    cocotb tests covering timing and result generation.
  details: https://github.com/5iri/tt-riscv-cpu/blob/main/docs/info.md
  details_label: Design notes
  image: /assets/img/projects/systolic-array-gds.jpg
  image_width: 900
  image_height: 624
  image_alt: Rendered GDS layout of the tt_um_systolic_vga die, showing standard-cell rows and vertical power straps across all metal layers.
  image_source: https://gds-viewer.tinytapeout.com (model from the tt-riscv-cpu gds GitHub Action)

- id: prosperity
  title: ProsperityHDL
  category: Spiking neural networks · RTL prototype
  repo: https://github.com/5iri/ProsperityHDL
  description: >-
    A single-tile research implementation of a product-sparsity accelerator
    for spiking neural networks. Its detector, pruner, and dispatcher find
    shared spike patterns so a 128-PE processor can reuse work. The current
    stack includes a LIF neuron backend, AXI4-Lite control, weight DMA, and
    simulation benchmarks for sparse-versus-dense execution and MNIST parity.
  details: https://github.com/5iri/ProsperityHDL/blob/main/BENCHMARKS.md
  details_label: Benchmarks
  image: /assets/img/projects/prosperity-tcam.png
  image_width: 1685
  image_height: 1191
  image_alt: Repository TCAM component diagram showing parallel matching lines, a line encoder, and result RAM.
  image_source: https://github.com/5iri/ProsperityHDL/blob/main/ppu/tcam/img/structure_top.gif
  # Image blob SHA: fcc518f3bbc432f498a01bf4c70f5908506e1cf7; converted GIF to PNG.
  # A full-pipeline simulation capture would be a better replacement when available.

- id: synapse32
  title: Synapse32
  category: SRA-VJTI · RISC-V CPU
  repo: https://github.com/SRA-VJTI/synapse32
  description: >-
    SRA-VJTI's five-stage RV32IMA core in Verilog, with forwarding,
    pipeline hazard handling, CSRs, and Sv32 virtual memory. Its SoC
    includes a timer, UART, and interrupt controller. The repo now has
    Verilator flows for OpenSBI and Linux with a BusyBox initramfs and
    an interactive serial console, alongside CPU regression tests.
  details: https://github.com/SRA-VJTI/synapse32/blob/main/docs/system_diagram.md
  details_label: Architecture
  schematic: pipeline

- id: raytracing
  title: Ray tracing in C
  category: C · graphics
  repo: https://github.com/5iri/raytracing-in-c
  description: >-
    A small ray tracer built up from image gradients and vector math.
    The current renderer casts camera rays, intersects a sphere,
    colors its surface normals, and adds a sky gradient. It writes
    PPM images directly; the image here is a rendered output already
    checked into the repo.
  details: https://github.com/5iri/raytracing-in-c/blob/main/use_vectors/ray_trace.c
  details_label: Renderer source
