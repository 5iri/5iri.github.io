- id: conway
  title: Conway in RISC-V assembly
  category: Assembly · cellular automata
  repo: https://github.com/5iri/conway-in-asm
  description: >-
    Conway's Game of Life on an 8×8 grid, written in RISC-V assembly.
    A glider evolves through the birth, survival, and death rules,
    with VT100 cursor control redrawing the terminal in place.
    The repo includes a configurable animation delay and Makefile
    targets to assemble and run the program with Spike.
  schematic: conway
