# Descriptions based on repository documentation, source, and project updates.
# Images are local assets, including captures rendered from project output.
- id: tiny3tpu
  title: Tiny3TPU
  category: FPGA accelerator · compiler · firmware
  repo: https://github.com/5iri/tiny3tpu
  description: >-
    Started with a matrix multiply. Built the little computer around it:
    a RISC-V CPU, two systolic cores, a compiler, and firmware. These demos
    ran on a KC705 with 64 KiB of on-chip RAM. It now renders directly
    to a display over HDMI.
  writeup: /blog/joy-of-owning-the-whole-stack
  details: https://github.com/5iri/tiny3tpu#things-that-actually-ran-on-the-board
  details_label: Board demos
  gallery:
    - image: /markdown_files/posts/assets/tiny3tpu-stack/banana.gif
      width: 760
      height: 720
      alt: A rotating banana mesh, drawn from transformed vertices computed on the KC705 FPGA.
      caption: The banana mesh, transformed on the board.
    - image: /markdown_files/posts/assets/tiny3tpu-stack/cloth.gif
      width: 760
      height: 720
      alt: A cloth simulation computed on the KC705, with measured compute time shown on each frame.
      caption: Cloth physics on the same board. Playback is sped up; each frame takes about 4.8 seconds to compute.
  image_source: https://github.com/SRA-VJTI/jaxsim/blob/c0a097bba1c6db10cac7b359fbac11cfedc48c6b/examples/softras_simple_render.py (mesh source), rendered via the board's own mesh transform

- id: tt-riscv-gpu
  title: SPI matrix accelerator
  category: tt-riscv-gpu · Tiny Tapeout
  repo: https://github.com/5iri/tt-riscv-gpu
  description: >-
    A tiny matrix accelerator that speaks SPI. Two lanes multiply 4×4
    matrices using unsigned 8-bit inputs and ternary weights: add, subtract,
    or skip. The compute takes 32 cycles, before SPI transfer overhead.
  details: https://github.com/5iri/tt-riscv-gpu/blob/main/docs/info.md
  details_label: Design notes
  image: /assets/img/projects/spi-matrix-gds.jpg
  image_width: 661
  image_height: 900
  image_format: portrait
  image_alt: Rendered GDS layout of the tt_um_riscv_gpu die, showing standard-cell rows and vertical power straps across all metal layers.
  image_caption: The rendered die layout, with all metal layers visible.
  image_source: https://gds-viewer.tinytapeout.com (model from the tt-riscv-gpu gds GitHub Action)

- id: prosperity
  title: ProsperityHDL
  category: Spiking neural networks · RTL prototype
  repo: https://github.com/5iri/ProsperityHDL
  description: >-
    Taking a spiking-neural-network accelerator from a paper into RTL.
    The idea is to find shared spike patterns and reuse their work across
    128 processing elements. A single-tile research prototype, with sparse
    execution and MNIST checks in simulation.
  details: https://github.com/5iri/ProsperityHDL/blob/main/BENCHMARKS.md
  details_label: Benchmarks
  image: /assets/img/projects/prosperity-tcam.png
  image_width: 1685
  image_height: 1191
  image_alt: Repository TCAM component diagram showing parallel matching lines, a line encoder, and result RAM.
  image_caption: The TCAM component's structure, from the repository documentation.
  image_source: https://github.com/5iri/ProsperityHDL/blob/main/ppu/tcam/img/structure_top.gif
  # Image blob SHA: fcc518f3bbc432f498a01bf4c70f5908506e1cf7; converted GIF to PNG.
  # A full-pipeline simulation capture would be a better replacement when available.

- id: synapse32
  title: Synapse32
  category: SRA-VJTI · RISC-V CPU
  repo: https://github.com/SRA-VJTI/synapse32
  description: >-
    SRA-VJTI's five-stage RV32IMA core in Verilog, with forwarding,
    hazard handling, and Sv32 virtual memory. The SoC has a timer, UART,
    and interrupt controller; its Verilator flow can boot OpenSBI and
    Linux with an interactive serial console.
  details: https://github.com/SRA-VJTI/synapse32/blob/main/docs/system_diagram.md
  details_label: Architecture
  schematic: pipeline
  schematic_caption: A sketch of the five-stage pipeline.

